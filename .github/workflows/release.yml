name: Build & Release AAZ Player (Windows)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'desktop/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version & skip if release already exists
        id: version_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content "desktop/package.json" -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "v$ver"
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "should_release=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Bump version in desktop/package.json to publish a new update."
            echo "should_release=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "New version $tag detected! Proceeding with Windows build & GitHub Release."
            echo "should_release=true" >> $env:GITHUB_OUTPUT
          }

      - name: Prepare app HTML & bind GitHub repo for auto-updater
        if: steps.version_check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/app" | Out-Null
          Copy-Item -Force "index.html" "desktop/app/index.html"

          $parts = "$env:GITHUB_REPOSITORY".Split("/")
          $owner = $parts[0]
          $repo = $parts[1]
          node -e "
            const fs = require('fs');
            const p = 'desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.build.publish = [{
              provider: 'github',
              owner: process.argv[1],
              repo: process.argv[2],
              releaseType: 'release'
            }];
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
            console.log('Bound electron-updater publish target to', process.argv[1] + '/' + process.argv[2]);
          " $owner $repo

      - name: Install desktop dependencies
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        run: npm install

      - name: Build Windows Installer & Portable + Publish Release
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ""
        run: npx electron-builder --win --publish always
