name: Build & Release Hamza (Windows & Android — Rust / Tauri)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'public/fonts/**'
      - 'desktop/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      allow_unsigned_preview:
        description: 'Allow publishing an unsigned/preview prerelease when signing secrets are not configured'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.should_release }}
      version: ${{ steps.version_check.outputs.version }}
      tag: ${{ steps.version_check.outputs.tag }}
      prerelease: ${{ steps.signing_gate.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version & skip if release already exists
        id: version_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content "desktop/package.json" -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "v$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ErrorActionPreference = "Continue"
            gh release view $tag *> $null
            $exists = ($LASTEXITCODE -eq 0)
            $global:LASTEXITCODE = 0
            if ($exists) {
              Write-Host "::error::Release $tag already exists. workflow_dispatch is fail-closed: it never publishes or uploads into an existing release. Bump the version in desktop/package.json for a new release."
              exit 1
            }
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=true"
            exit 0
          }

          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($exists) {
            Write-Host "Release $tag already exists. Bump version in desktop/package.json to publish a new update."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=false"
          } else {
            Write-Host "New version $tag detected! Proceeding with Rust/Tauri Windows build & GitHub Release."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=true"
          }
          exit 0

      - name: Verify Minisign signing configuration (fail closed)
        id: signing_gate
        if: steps.version_check.outputs.should_release == 'true'
        shell: pwsh
        env:
          AAZ_UPDATER_SIGNING_KEY: ${{ secrets.AAZ_UPDATER_SIGNING_KEY }}
          AAZ_UPDATER_PUBLIC_KEY: ${{ secrets.AAZ_UPDATER_PUBLIC_KEY || vars.AAZ_UPDATER_PUBLIC_KEY }}
          ALLOW_UNSIGNED_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned_preview }}
        run: |
          $hasSigningKey = -not [string]::IsNullOrWhiteSpace($env:AAZ_UPDATER_SIGNING_KEY)
          $hasPublicKey = -not [string]::IsNullOrWhiteSpace($env:AAZ_UPDATER_PUBLIC_KEY)
          $allowPreview = ($env:ALLOW_UNSIGNED_PREVIEW -eq "true")

          if ($hasSigningKey -and -not $hasPublicKey) {
            Write-Error "AAZ_UPDATER_SIGNING_KEY is configured, but AAZ_UPDATER_PUBLIC_KEY is missing. Both secrets are required so the compiled binary can verify signatures."
            exit 1
          }

          if (-not $hasSigningKey -or -not $hasPublicKey) {
            if ($allowPreview) {
              Write-Host "::warning::Publishing an UNSIGNED PRERELEASE preview because allow_unsigned_preview=true. The in-app updater will refuse unsigned builds."
              Add-Content -Path $env:GITHUB_OUTPUT -Value "signed=false"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=true"
              exit 0
            }
            Write-Error "Release blocked (fail-closed): AAZ_UPDATER_SIGNING_KEY and AAZ_UPDATER_PUBLIC_KEY must both be configured in GitHub Secrets/Variables before publishing a stable release. To build an unsigned test preview manually, run workflow_dispatch with allow_unsigned_preview=true."
            exit 1
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "signed=true"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=false"

      - name: Setup Rust stable toolchain
        if: steps.version_check.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: steps.version_check.outputs.should_release == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Prepare modular frontend, version & GitHub repo for Rust auto-updater
        if: steps.version_check.outputs.should_release == 'true'
        env:
          AAZ_UPDATER_PUBLIC_KEY: ${{ secrets.AAZ_UPDATER_PUBLIC_KEY || vars.AAZ_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/prepare-ci.cjs

      - name: Run automated JavaScript tests
        if: steps.version_check.outputs.should_release == 'true'
        run: node tests/run-tests.cjs

      - name: Run Rust unit & security tests
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Install Tauri CLI
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        run: npm install

      - name: Generate Tauri icon bundle
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        run: npx @tauri-apps/cli icon assets/icon.png -o src-tauri/icons

      - name: Build lightweight Rust/Tauri Windows NSIS Installer & Portable EXE
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Collect artifacts, generate SHA256SUMS.txt, sign with Minisign & publish GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AAZ_UPDATER_SIGNING_KEY: ${{ secrets.AAZ_UPDATER_SIGNING_KEY }}
          AAZ_UPDATER_SIGNING_KEY_PASSWORD: ${{ secrets.AAZ_UPDATER_SIGNING_KEY_PASSWORD }}
          AAZ_UPDATER_PUBLIC_KEY: ${{ secrets.AAZ_UPDATER_PUBLIC_KEY || vars.AAZ_UPDATER_PUBLIC_KEY }}
          SIGNED_RELEASE: ${{ steps.signing_gate.outputs.signed }}
          IS_PRERELEASE: ${{ steps.signing_gate.outputs.prerelease }}
        run: |
          $ver = "${{ steps.version_check.outputs.version }}"
          $tag = "${{ steps.version_check.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path "release-out" | Out-Null

          $nsisInstaller = Get-ChildItem -Path "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $nsisInstaller) {
            Write-Error "Could not locate built NSIS installer!"
            exit 1
          }
          $setupDest = "release-out/Hamza-Setup-$ver.exe"
          Copy-Item $nsisInstaller.FullName -Destination $setupDest -Force

          $portableBin = "desktop/src-tauri/target/release/aaz-player.exe"
          if (-not (Test-Path $portableBin)) {
            Write-Error "Could not locate built portable Rust binary!"
            exit 1
          }
          $portableDest = "release-out/Hamza-Portable-$ver.exe"
          Copy-Item $portableBin -Destination $portableDest -Force

          # Generate SHA256SUMS.txt for fail-closed integrity verification
          $setupHash = (Get-FileHash -Path $setupDest -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash -Path $portableDest -Algorithm SHA256).Hash.ToLower()
          $sumsPath = "release-out/SHA256SUMS.txt"
          @(
            "$setupHash  Hamza-Setup-$ver.exe",
            "$portableHash  Hamza-Portable-$ver.exe"
          ) | Set-Content -Path $sumsPath -Encoding UTF8

          $uploadFiles = @($setupDest, $portableDest, $sumsPath)

          if ($env:SIGNED_RELEASE -eq "true") {
            $minisignZip = Join-Path $env:RUNNER_TEMP "minisign-0.12-win64.zip"
            $minisignDir = Join-Path $env:RUNNER_TEMP "minisign-0.12"
            if (Test-Path $minisignDir) { Remove-Item -Path $minisignDir -Recurse -Force }
            Invoke-WebRequest -Uri "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip" -OutFile $minisignZip
            Expand-Archive -Path $minisignZip -DestinationPath $minisignDir -Force
            $minisignBin = Get-ChildItem -Path $minisignDir -Filter "minisign.exe" -Recurse |
              Where-Object { $_.FullName -match 'x86_64' } |
              Select-Object -First 1
            if (-not $minisignBin) {
              $minisignBin = Get-ChildItem -Path $minisignDir -Filter "minisign.exe" -Recurse |
                Where-Object { $_.FullName -notmatch 'aarch64|arm64' } |
                Select-Object -First 1
            }
            if (-not $minisignBin) {
              Write-Error "Could not locate minisign.exe in downloaded Minisign 0.12 archive"
              exit 1
            }
            $minisignExe = $minisignBin.FullName
            & $minisignExe -v

            $keyFile = Join-Path $env:RUNNER_TEMP "aaz-updater.key"
            $pubKey = $env:AAZ_UPDATER_PUBLIC_KEY.Trim()
            try {
              $cleanKey = ($env:AAZ_UPDATER_SIGNING_KEY -replace "`r`n", "`n").Trim() + "`n"
              [System.IO.File]::WriteAllText($keyFile, $cleanKey, [System.Text.UTF8Encoding]::new($false))
              foreach ($targetFile in @($setupDest, $portableDest, $sumsPath)) {
                $fileName = [System.IO.Path]::GetFileName($targetFile)
                $fileHash = (Get-FileHash -Path $targetFile -Algorithm SHA256).Hash.ToLower()
                $trustedComment = "aaz-player|version=$ver|file=$fileName|sha256=$fileHash"
                if ([string]::IsNullOrEmpty($env:AAZ_UPDATER_SIGNING_KEY_PASSWORD)) {
                  & $minisignExe -S -s $keyFile -m $targetFile -t $trustedComment
                } else {
                  $env:AAZ_UPDATER_SIGNING_KEY_PASSWORD | & $minisignExe -S -s $keyFile -m $targetFile -t $trustedComment
                }
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Minisign signing failed for $targetFile"
                  exit 1
                }
                $sigPath = "$targetFile.minisig"
                if (-not (Test-Path $sigPath)) {
                  Write-Error "Expected signature file missing: $sigPath"
                  exit 1
                }
                & $minisignExe -V -P $pubKey -m $targetFile -x $sigPath
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Minisign self-verification failed for $targetFile"
                  exit 1
                }
                $uploadFiles += $sigPath
              }
            } finally {
              if (Test-Path $keyFile) { Remove-Item -Path $keyFile -Force }
            }
          } else {
            Write-Host "::warning::Publishing unsigned prerelease preview (allow_unsigned_preview=true)."
          }

          Write-Host "Built artifacts & checksums:"
          Get-ChildItem "release-out" | ForEach-Object { Write-Host " - $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
          Get-Content $sumsPath

          # Extract release notes for this version from CHANGELOG.md
          $notes = ""
          if (Test-Path "CHANGELOG.md") {
            $changelog = Get-Content "CHANGELOG.md" -Raw
            $escapedVer = [regex]::Escape($ver)
            $pattern = "(?ms)^## \[$escapedVer\][^\r\n]*\r?\n(.*?)(?=\r?\n---|\r?\n## \[|\z)"
            $match = [regex]::Match($changelog, $pattern)
            if ($match.Success) {
              $notes = $match.Groups[1].Value.Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Hamza $tag — Security-hardened local audio & video player for Windows with overhauled Mini Player, native Windows taskbar media controls, 16 green-identity themes, and fail-closed SHA-256 + Minisign auto-updater."
          }
          if ($env:IS_PRERELEASE -eq "true") {
            $notes = "> **Unsigned Preview Build:** Minisign secrets were not configured for this manual preview build. The in-app auto-updater refuses unsigned updates.`n`n$notes"
          }
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$ver.md"
          Set-Content -Path $notesFile -Value $notes -Encoding UTF8

          $isPreview = ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.allow_unsigned_preview }}" -eq "true")
          if ($isPreview) {
            Write-Host "::notice::Unsigned preview build: skipping ALL GitHub Release operations (fail-closed separation). Artifacts are published as workflow artifacts only, never on any release."
          } else {
            $ErrorActionPreference = "Continue"
            gh release view $tag *> $null
            $exists = ($LASTEXITCODE -eq 0)
            $global:LASTEXITCODE = 0

            if ($exists) {
              Write-Host "::error::Release $tag already exists at publish time. Refusing to modify an existing release (fail-closed)."
              exit 1
            } else {
            $createArgs = @("release", "create", $tag) + $uploadFiles + @("--title", "Hamza $tag", "--notes-file", $notesFile)
            if ($env:IS_PRERELEASE -eq "true") {
              $createArgs += "--prerelease"
            }
            & gh @createArgs
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload unsigned preview as workflow artifacts (never a release)
        if: steps.version_check.outputs.should_release == 'true' && github.event_name == 'workflow_dispatch' && inputs.allow_unsigned_preview == true
        uses: actions/upload-artifact@v4
        with:
          name: Hamza-unsigned-preview-windows
          path: release-out/

  build-android:
    needs: build-windows
    if: needs.build-windows.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android signing configuration (fail closed)
        id: android_signing_gate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALLOW_UNSIGNED_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned_preview }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$ALLOW_UNSIGNED_PREVIEW" = "true" ]; then
            echo "::warning::Android release keystore secrets not configured; signing with ephemeral preview key because allow_unsigned_preview=true."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release blocked (fail-closed): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD must be configured in GitHub Secrets for stable Android releases. Use workflow_dispatch with allow_unsigned_preview=true for a preview build."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust stable with Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust Android dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          key: android-release

      - name: Configure Android SDK & NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Prepare frontend, version & GitHub repo config
        run: node desktop/scripts/prepare-ci.cjs

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Initialize Tauri Android project, adaptive icons & Phase 4 native Kotlin bridge
        working-directory: desktop
        run: |
          npx @tauri-apps/cli android init --skip-targets-install
          npx @tauri-apps/cli icon assets/icon.png
          node scripts/configure-android.cjs

      - name: Build lightweight ARM64 Release APK
        working-directory: desktop
        run: npx @tauri-apps/cli android build --apk --target aarch64

      - name: Align, sign, verify APK & publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_VERSION: ${{ needs.build-windows.outputs.version }}
          REL_TAG: ${{ needs.build-windows.outputs.tag }}
          ANDROID_SIGNED: ${{ steps.android_signing_gate.outputs.signed }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-android
          RAW_APK=$(find desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "No built Android APK found!"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          ALIGNED_APK="$RUNNER_TEMP/aaz-aligned.apk"
          FINAL_NAME="Hamza-Android-arm64-${REL_VERSION}.apk"
          FINAL_APK="release-android/${FINAL_NAME}"
          KEYSTORE_FILE="$RUNNER_TEMP/aaz-release.keystore"

          "$ZIPALIGN" -f -p 4 "$RAW_APK" "$ALIGNED_APK"

          if [ "$ANDROID_SIGNED" = "true" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "env:ANDROID_KEY_PASSWORD" \
              --out "$FINAL_APK" \
              "$ALIGNED_APK"
          else
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -storepass android -keypass android \
              -alias aazpreview -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=Hamza Preview,O=Hamza,C=US"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias aazpreview \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$FINAL_APK" \
              "$ALIGNED_APK"
          fi

          "$APKSIGNER" verify --verbose "$FINAL_APK"

          (cd release-android && sha256sum "${FINAL_NAME}" > "${FINAL_NAME}.sha256")
          ls -lh "release-android/${FINAL_NAME}"
          cat "release-android/${FINAL_NAME}.sha256"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_unsigned_preview }}" = "true" ]; then
            echo "::notice::Unsigned preview build: skipping GitHub Release upload (fail-closed separation). APK is published as a workflow artifact only."
          else
            gh release upload "$REL_TAG" \
              "release-android/${FINAL_NAME}" \
              "release-android/${FINAL_NAME}.sha256" \
              --clobber
          fi

      - name: Upload unsigned preview APK as workflow artifact (never a release)
        if: github.event_name == 'workflow_dispatch' && inputs.allow_unsigned_preview == true
        uses: actions/upload-artifact@v4
        with:
          name: Hamza-unsigned-preview-android
          path: release-android/

      - name: Clean temporary Android signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aaz-release.keystore" "$RUNNER_TEMP/aaz-aligned.apk"
