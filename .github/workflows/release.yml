name: Build & Release AAZ Player (Windows — Rust / Tauri)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'public/fonts/**'
      - 'desktop/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version & skip if release already exists
        id: version_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content "desktop/package.json" -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "v$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=true"
            $global:LASTEXITCODE = 0
            exit 0
          }

          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($exists) {
            Write-Host "Release $tag already exists. Bump version in desktop/package.json to publish a new update."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=false"
          } else {
            Write-Host "New version $tag detected! Proceeding with Rust/Tauri Windows build & GitHub Release."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=true"
          }
          exit 0

      - name: Setup Rust stable toolchain
        if: steps.version_check.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: steps.version_check.outputs.should_release == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Prepare modular frontend, version & GitHub repo for Rust auto-updater
        if: steps.version_check.outputs.should_release == 'true'
        env:
          AAZ_UPDATER_PUBLIC_KEY: ${{ secrets.AAZ_UPDATER_PUBLIC_KEY || vars.AAZ_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/prepare-ci.cjs

      - name: Run automated JavaScript tests
        if: steps.version_check.outputs.should_release == 'true'
        run: node tests/run-tests.cjs

      - name: Run Rust unit & security tests
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Install Tauri CLI
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        run: npm install

      - name: Generate Tauri icon bundle
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        run: npx @tauri-apps/cli icon assets/icon.png -o src-tauri/icons

      - name: Build lightweight Rust/Tauri Windows NSIS Installer & Portable EXE
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Collect artifacts, generate SHA256SUMS.txt, sign with Minisign & publish GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AAZ_UPDATER_SIGNING_KEY: ${{ secrets.AAZ_UPDATER_SIGNING_KEY }}
          AAZ_UPDATER_SIGNING_KEY_PASSWORD: ${{ secrets.AAZ_UPDATER_SIGNING_KEY_PASSWORD }}
          AAZ_UPDATER_PUBLIC_KEY: ${{ secrets.AAZ_UPDATER_PUBLIC_KEY || vars.AAZ_UPDATER_PUBLIC_KEY }}
        run: |
          $ver = "${{ steps.version_check.outputs.version }}"
          $tag = "${{ steps.version_check.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path "release-out" | Out-Null

          $nsisInstaller = Get-ChildItem -Path "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $nsisInstaller) {
            Write-Error "Could not locate built NSIS installer!"
            exit 1
          }
          $setupDest = "release-out/AAZ-Player-Setup-$ver.exe"
          Copy-Item $nsisInstaller.FullName -Destination $setupDest -Force

          $portableBin = "desktop/src-tauri/target/release/aaz-player.exe"
          if (-not (Test-Path $portableBin)) {
            Write-Error "Could not locate built portable Rust binary!"
            exit 1
          }
          $portableDest = "release-out/AAZ-Player-Portable-$ver.exe"
          Copy-Item $portableBin -Destination $portableDest -Force

          # Generate SHA256SUMS.txt for fail-closed integrity verification
          $setupHash = (Get-FileHash -Path $setupDest -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash -Path $portableDest -Algorithm SHA256).Hash.ToLower()
          $sumsPath = "release-out/SHA256SUMS.txt"
          @(
            "$setupHash  AAZ-Player-Setup-$ver.exe",
            "$portableHash  AAZ-Player-Portable-$ver.exe"
          ) | Set-Content -Path $sumsPath -Encoding UTF8

          $uploadFiles = @($setupDest, $portableDest, $sumsPath)

          if (-not [string]::IsNullOrWhiteSpace($env:AAZ_UPDATER_SIGNING_KEY)) {
            if (-not (Get-Command minisign -ErrorAction SilentlyContinue)) {
              choco install minisign -y --no-progress | Out-Null
            }
            $keyFile = Join-Path $env:RUNNER_TEMP "aaz-updater.key"
            try {
              Set-Content -Path $keyFile -Value $env:AAZ_UPDATER_SIGNING_KEY -NoNewline -Encoding UTF8
              foreach ($targetFile in @($setupDest, $portableDest, $sumsPath)) {
                $pw = if ($null -ne $env:AAZ_UPDATER_SIGNING_KEY_PASSWORD) { $env:AAZ_UPDATER_SIGNING_KEY_PASSWORD } else { "" }
                $pw | minisign -S -s $keyFile -m $targetFile
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Minisign signing failed for $targetFile"
                  exit 1
                }
                $sigPath = "$targetFile.minisig"
                if (-not (Test-Path $sigPath)) {
                  Write-Error "Expected signature file missing: $sigPath"
                  exit 1
                }
                if (-not [string]::IsNullOrWhiteSpace($env:AAZ_UPDATER_PUBLIC_KEY)) {
                  minisign -V -P $env:AAZ_UPDATER_PUBLIC_KEY -m $targetFile -x $sigPath
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Minisign self-verification failed for $targetFile"
                    exit 1
                  }
                }
                $uploadFiles += $sigPath
              }
            } finally {
              if (Test-Path $keyFile) { Remove-Item -Path $keyFile -Force }
            }
          } else {
            Write-Host "::warning::AAZ_UPDATER_SIGNING_KEY secret is not configured. Release artifacts are unsigned; the in-app updater refuses unsigned updates (fail closed) until signing keys are configured."
          }

          Write-Host "Built artifacts & checksums:"
          Get-ChildItem "release-out" | ForEach-Object { Write-Host " - $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
          Get-Content $sumsPath

          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          $notes = "AAZ Player $tag — Rust + Tauri v2 desktop media player with fail-closed SHA-256 + Minisign updater verification, offline bundled fonts, Mini Player, Watch History, Media Library, customizable shortcuts, and Playback Settings."
          if ($exists) {
            gh release upload $tag @uploadFiles --clobber
          } else {
            gh release create $tag @uploadFiles --title "AAZ Player $tag" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
