name: Build & Release AAZ Player (Windows)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'desktop/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version & skip if release already exists
        id: version_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content "desktop/package.json" -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "v$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=true"
            $global:LASTEXITCODE = 0
            exit 0
          }

          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($exists) {
            Write-Host "Release $tag already exists. Bump version in desktop/package.json to publish a new update."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=false"
          } else {
            Write-Host "New version $tag detected! Proceeding with Windows build & GitHub Release."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=true"
          }
          exit 0

      - name: Prepare app HTML & bind GitHub repo for auto-updater
        if: steps.version_check.outputs.should_release == 'true'
        run: node desktop/scripts/prepare-ci.cjs

      - name: Install desktop dependencies
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        run: npm install

      - name: Build Windows Installer & Portable + Publish Release
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ""
        run: npx electron-builder --win --publish always
