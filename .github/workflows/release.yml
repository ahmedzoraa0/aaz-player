name: Build & Release AAZ Player (Windows — Rust / Tauri)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'public/fonts/**'
      - 'desktop/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      allow_unsigned_preview:
        description: 'Allow publishing an unsigned prerelease preview when Minisign secrets are not configured'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version & skip if release already exists
        id: version_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content "desktop/package.json" -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "v$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=true"
            $global:LASTEXITCODE = 0
            exit 0
          }

          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($exists) {
            Write-Host "Release $tag already exists. Bump version in desktop/package.json to publish a new update."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=false"
          } else {
            Write-Host "New version $tag detected! Proceeding with Rust/Tauri Windows build & GitHub Release."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=true"
          }
          exit 0

      - name: Verify Minisign signing configuration (fail closed)
        id: signing_gate
        if: steps.version_check.outputs.should_release == 'true'
        shell: pwsh
        env:
          AAZ_UPDATER_SIGNING_KEY: ${{ secrets.AAZ_UPDATER_SIGNING_KEY }}
          AAZ_UPDATER_PUBLIC_KEY: ${{ secrets.AAZ_UPDATER_PUBLIC_KEY || vars.AAZ_UPDATER_PUBLIC_KEY }}
          ALLOW_UNSIGNED_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned_preview }}
        run: |
          $hasSigningKey = -not [string]::IsNullOrWhiteSpace($env:AAZ_UPDATER_SIGNING_KEY)
          $hasPublicKey = -not [string]::IsNullOrWhiteSpace($env:AAZ_UPDATER_PUBLIC_KEY)
          $allowPreview = ($env:ALLOW_UNSIGNED_PREVIEW -eq "true")

          if ($hasSigningKey -and -not $hasPublicKey) {
            Write-Error "AAZ_UPDATER_SIGNING_KEY is configured, but AAZ_UPDATER_PUBLIC_KEY is missing. Both secrets are required so the compiled binary can verify signatures."
            exit 1
          }

          if (-not $hasSigningKey -or -not $hasPublicKey) {
            if ($allowPreview) {
              Write-Host "::warning::Publishing an UNSIGNED PRERELEASE preview because allow_unsigned_preview=true. The in-app updater will refuse unsigned builds."
              Add-Content -Path $env:GITHUB_OUTPUT -Value "signed=false"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=true"
              exit 0
            }
            Write-Error "Release blocked (fail-closed): AAZ_UPDATER_SIGNING_KEY and AAZ_UPDATER_PUBLIC_KEY must both be configured in GitHub Secrets/Variables before publishing a stable release. To build an unsigned test preview manually, run workflow_dispatch with allow_unsigned_preview=true."
            exit 1
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "signed=true"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=false"

      - name: Setup Rust stable toolchain
        if: steps.version_check.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: steps.version_check.outputs.should_release == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Prepare modular frontend, version & GitHub repo for Rust auto-updater
        if: steps.version_check.outputs.should_release == 'true'
        env:
          AAZ_UPDATER_PUBLIC_KEY: ${{ secrets.AAZ_UPDATER_PUBLIC_KEY || vars.AAZ_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/prepare-ci.cjs

      - name: Run automated JavaScript tests
        if: steps.version_check.outputs.should_release == 'true'
        run: node tests/run-tests.cjs

      - name: Run Rust unit & security tests
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Install Tauri CLI
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        run: npm install

      - name: Generate Tauri icon bundle
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        run: npx @tauri-apps/cli icon assets/icon.png -o src-tauri/icons

      - name: Build lightweight Rust/Tauri Windows NSIS Installer & Portable EXE
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: desktop
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Collect artifacts, generate SHA256SUMS.txt, sign with Minisign & publish GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AAZ_UPDATER_SIGNING_KEY: ${{ secrets.AAZ_UPDATER_SIGNING_KEY }}
          AAZ_UPDATER_SIGNING_KEY_PASSWORD: ${{ secrets.AAZ_UPDATER_SIGNING_KEY_PASSWORD }}
          AAZ_UPDATER_PUBLIC_KEY: ${{ secrets.AAZ_UPDATER_PUBLIC_KEY || vars.AAZ_UPDATER_PUBLIC_KEY }}
          SIGNED_RELEASE: ${{ steps.signing_gate.outputs.signed }}
          IS_PRERELEASE: ${{ steps.signing_gate.outputs.prerelease }}
        run: |
          $ver = "${{ steps.version_check.outputs.version }}"
          $tag = "${{ steps.version_check.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path "release-out" | Out-Null

          $nsisInstaller = Get-ChildItem -Path "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $nsisInstaller) {
            Write-Error "Could not locate built NSIS installer!"
            exit 1
          }
          $setupDest = "release-out/AAZ-Player-Setup-$ver.exe"
          Copy-Item $nsisInstaller.FullName -Destination $setupDest -Force

          $portableBin = "desktop/src-tauri/target/release/aaz-player.exe"
          if (-not (Test-Path $portableBin)) {
            Write-Error "Could not locate built portable Rust binary!"
            exit 1
          }
          $portableDest = "release-out/AAZ-Player-Portable-$ver.exe"
          Copy-Item $portableBin -Destination $portableDest -Force

          # Generate SHA256SUMS.txt for fail-closed integrity verification
          $setupHash = (Get-FileHash -Path $setupDest -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash -Path $portableDest -Algorithm SHA256).Hash.ToLower()
          $sumsPath = "release-out/SHA256SUMS.txt"
          @(
            "$setupHash  AAZ-Player-Setup-$ver.exe",
            "$portableHash  AAZ-Player-Portable-$ver.exe"
          ) | Set-Content -Path $sumsPath -Encoding UTF8

          $uploadFiles = @($setupDest, $portableDest, $sumsPath)

          if ($env:SIGNED_RELEASE -eq "true") {
            $minisignZip = Join-Path $env:RUNNER_TEMP "minisign-0.12-win64.zip"
            $minisignDir = Join-Path $env:RUNNER_TEMP "minisign-0.12"
            if (Test-Path $minisignDir) { Remove-Item -Path $minisignDir -Recurse -Force }
            Invoke-WebRequest -Uri "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip" -OutFile $minisignZip
            Expand-Archive -Path $minisignZip -DestinationPath $minisignDir -Force
            $minisignBin = Get-ChildItem -Path $minisignDir -Filter "minisign.exe" -Recurse |
              Where-Object { $_.FullName -match 'x86_64' } |
              Select-Object -First 1
            if (-not $minisignBin) {
              $minisignBin = Get-ChildItem -Path $minisignDir -Filter "minisign.exe" -Recurse |
                Where-Object { $_.FullName -notmatch 'aarch64|arm64' } |
                Select-Object -First 1
            }
            if (-not $minisignBin) {
              Write-Error "Could not locate minisign.exe in downloaded Minisign 0.12 archive"
              exit 1
            }
            $minisignExe = $minisignBin.FullName
            & $minisignExe -v

            $keyFile = Join-Path $env:RUNNER_TEMP "aaz-updater.key"
            $pubKey = $env:AAZ_UPDATER_PUBLIC_KEY.Trim()
            try {
              $cleanKey = ($env:AAZ_UPDATER_SIGNING_KEY -replace "`r`n", "`n").Trim() + "`n"
              [System.IO.File]::WriteAllText($keyFile, $cleanKey, [System.Text.UTF8Encoding]::new($false))
              foreach ($targetFile in @($setupDest, $portableDest, $sumsPath)) {
                $fileName = [System.IO.Path]::GetFileName($targetFile)
                $fileHash = (Get-FileHash -Path $targetFile -Algorithm SHA256).Hash.ToLower()
                $trustedComment = "aaz-player|version=$ver|file=$fileName|sha256=$fileHash"
                if ([string]::IsNullOrEmpty($env:AAZ_UPDATER_SIGNING_KEY_PASSWORD)) {
                  & $minisignExe -S -s $keyFile -m $targetFile -t $trustedComment
                } else {
                  $env:AAZ_UPDATER_SIGNING_KEY_PASSWORD | & $minisignExe -S -s $keyFile -m $targetFile -t $trustedComment
                }
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Minisign signing failed for $targetFile"
                  exit 1
                }
                $sigPath = "$targetFile.minisig"
                if (-not (Test-Path $sigPath)) {
                  Write-Error "Expected signature file missing: $sigPath"
                  exit 1
                }
                & $minisignExe -V -P $pubKey -m $targetFile -x $sigPath
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Minisign self-verification failed for $targetFile"
                  exit 1
                }
                $uploadFiles += $sigPath
              }
            } finally {
              if (Test-Path $keyFile) { Remove-Item -Path $keyFile -Force }
            }
          } else {
            Write-Host "::warning::Publishing unsigned prerelease preview (allow_unsigned_preview=true)."
          }

          Write-Host "Built artifacts & checksums:"
          Get-ChildItem "release-out" | ForEach-Object { Write-Host " - $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
          Get-Content $sumsPath

          # Extract release notes for this version from CHANGELOG.md
          $notes = ""
          if (Test-Path "CHANGELOG.md") {
            $changelog = Get-Content "CHANGELOG.md" -Raw
            $escapedVer = [regex]::Escape($ver)
            $pattern = "(?ms)^## \[$escapedVer\][^\r\n]*\r?\n(.*?)(?=\r?\n---|\r?\n## \[|\z)"
            $match = [regex]::Match($changelog, $pattern)
            if ($match.Success) {
              $notes = $match.Groups[1].Value.Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "AAZ Player $tag — Security-hardened local audio & video player for Windows with overhauled Mini Player, native Windows taskbar media controls, 16 green-identity themes, and fail-closed SHA-256 + Minisign auto-updater."
          }
          if ($env:IS_PRERELEASE -eq "true") {
            $notes = "> **Unsigned Preview Build:** Minisign secrets were not configured for this manual preview build. The in-app auto-updater refuses unsigned updates.`n`n$notes"
          }
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$ver.md"
          Set-Content -Path $notesFile -Value $notes -Encoding UTF8

          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($exists) {
            gh release upload $tag @uploadFiles --clobber
          } else {
            $createArgs = @("release", "create", $tag) + $uploadFiles + @("--title", "AAZ Player $tag", "--notes-file", $notesFile)
            if ($env:IS_PRERELEASE -eq "true") {
              $createArgs += "--prerelease"
            }
            & gh @createArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
