name: CI — Lint, Security & Automated Tests

on:
  push:
    branches:
      - main
      - master
      - 'security/**'
      - 'refactor/**'
      - 'features/**'
      - 'bugfix/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  frontend-tests:
    name: Frontend Syntax, Security & Module Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript lint check
        run: npm run lint

      - name: Build production frontend bundle
        run: npm run build

      - name: Sync frontend assets into desktop/app
        run: node desktop/scripts/prepare-ci.cjs

      - name: Run automated JavaScript test suite
        run: node tests/run-tests.cjs

  rust-checks:
    name: Rust Format, Clippy & Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Sync frontend assets
        run: node desktop/scripts/prepare-ci.cjs

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy lints
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -W clippy::all -D clippy::correctness -D clippy::suspicious

      - name: Run Rust unit & security tests
        working-directory: desktop/src-tauri
        run: cargo test -- --nocapture

  android-debug-build:
    name: Android Debug APK Build (R4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Export NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust stable toolchain with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          key: android-debug

      - name: Install desktop Tauri CLI dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Sync frontend assets & versionCode
        run: node desktop/scripts/prepare-ci.cjs

      - name: Initialize & configure Android project
        working-directory: desktop
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi
          npx tauri icon assets/icon.png
          node scripts/configure-android.cjs
          node scripts/prepare-ci.cjs

      - name: Build lightweight Android APK (aarch64 Release + R8 shrink)
        working-directory: desktop
        run: npx tauri android build --apk --target aarch64

      - name: Sign preview APK for direct phone testing (ephemeral debug keystore)
        working-directory: desktop
        run: |
          mkdir -p android-out
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No built APK found!" >&2
            exit 1
          fi
          echo "Built raw APK: $UNSIGNED_APK ($(du -h "$UNSIGNED_APK" | cut -f1))"
          KEYSTORE="$RUNNER_TEMP/aaz-preview-debug.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=AAZ Player Preview,O=AAZ,C=US"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ALIGNED_APK="$RUNNER_TEMP/aaz-aligned.apk"
          SIGNED_APK="android-out/AAZ-Player-Android-Preview.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify "$SIGNED_APK"
          ls -lh "$SIGNED_APK"

      - name: Upload lightweight Android Preview APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaz-player-android-preview-apk
          path: desktop/android-out/AAZ-Player-Android-Preview.apk
          if-no-files-found: error

