name: CI — Lint, Security & Automated Tests

on:
  push:
    branches:
      - main
      - master
      - 'security/**'
      - 'refactor/**'
      - 'features/**'
      - 'bugfix/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  frontend-tests:
    name: Frontend Syntax, Security & Module Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript lint check
        run: npm run lint

      - name: Build production frontend bundle
        run: npm run build

      - name: Sync frontend assets into desktop/app
        run: node desktop/scripts/prepare-ci.cjs

      - name: Run automated JavaScript test suite
        run: node tests/run-tests.cjs

  rust-checks:
    name: Rust Format, Clippy & Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Sync frontend assets
        run: node desktop/scripts/prepare-ci.cjs

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy lints
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -W clippy::all -D clippy::correctness -D clippy::suspicious

      - name: Run Rust unit & security tests
        working-directory: desktop/src-tauri
        run: cargo test -- --nocapture

  android-debug-build:
    name: Android Debug APK Build (R4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Export NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust stable toolchain with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          key: android-debug

      - name: Install desktop Tauri CLI dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Sync frontend assets & versionCode
        run: node desktop/scripts/prepare-ci.cjs

      - name: Initialize Android project if absent
        working-directory: desktop
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi
          node scripts/prepare-ci.cjs

      - name: Build Android Debug APK (aarch64)
        working-directory: desktop
        run: npx tauri android build --apk --debug --target aarch64

      - name: Upload Android Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaz-player-android-debug-apk
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

