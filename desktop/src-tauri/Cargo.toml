[package]
name = "aaz-player"
version = "1.10.1"
description = "AAZ Player — Lightweight Native Rust & WebView2 Local Audio & Video Player"
authors = ["AAZ"]
edition = "2021"

[lib]
name = "aaz_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
percent-encoding = "2"
base64 = "0.22"
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"
getrandom = "0.2"
minisign-verify = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = "2"
rfd = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
