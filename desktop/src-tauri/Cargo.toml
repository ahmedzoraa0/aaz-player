[package]
name = "aaz-player"
version = "1.3.1"
description = "AAZ Player — Lightweight Native Rust & WebView2 Local Audio & Video Player"
authors = ["AAZ"]
edition = "2021"

[lib]
name = "aaz_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
encoding_rs = "0.8"
percent-encoding = "2"
base64 = "0.22"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
